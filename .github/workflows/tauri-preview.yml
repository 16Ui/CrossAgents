name: Tauri preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/gui/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/tauri-preview.yml'

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/gui/src-tauri
      - run: npm --prefix apps/gui ci
      - run: cargo check --workspace --locked
      - run: npm --prefix apps/gui test
      - run: npm --prefix apps/gui run tauri:bundle
      - run: cargo test --manifest-path apps/gui/src-tauri/Cargo.toml --release --locked --features bundled-hub
      - name: Verify bundled macOS executables
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          app="apps/gui/src-tauri/target/release/bundle/macos/CrossAgents.app/Contents/MacOS"
          "$app/crossagents" --version
          "$app/crossagents-link" --version
      - uses: actions/upload-artifact@v4
        with:
          name: CrossAgents-Tauri-${{ runner.os }}
          path: |
            apps/gui/src-tauri/target/release/bundle/nsis/*.exe
            apps/gui/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
