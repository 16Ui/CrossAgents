[package]
name = "crossagents-tauri"
version = "0.2.43"
edition = "2024"
publish = false

[workspace]

[build-dependencies]
tauri-build = "2"

[dependencies]
dirs = "7"
eventsource-stream = "0.2"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }
tokio = { version = "1", features = ["time"] }
