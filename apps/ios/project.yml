name: CrossAgents
options:
  bundleIdPrefix: dev.crossagents
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.3.10"
    CURRENT_PROJECT_VERSION: "1"
    SUPPORTS_MACCATALYST: NO

targets:
  CrossAgents:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CrossAgents
        excludes:
          - "**/.DS_Store"
    dependencies:
      - framework: Frameworks/CrossAgentsLink.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: AVFoundation.framework
      - sdk: PhotosUI.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crossagents.ios
        PRODUCT_NAME: CrossAgents
        INFOPLIST_FILE: CrossAgents/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
