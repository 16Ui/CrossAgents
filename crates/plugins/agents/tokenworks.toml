# 词元工坊 (Token Workshop) — DeepSeek's `dsh` harness, the built-in agent
# (docs/DESIGN.md §9.3).
#
# `dsh --profile acp` serves the Agent Client Protocol over stdio, so this description needs
# no driver code: `acp-generic` speaks the protocol and the runtime answers with its own
# model and reasoning-effort options (`configOptions` on `session/new`) — which is how the
# model and effort below reach it.
#
# The desktop app (词元工坊.exe) carries its own copy of the runtime under
# `resources/runtime` and does not put it on PATH; the standalone CLI is the supported entry
# point, and it reads the same `~/.dsh` profiles and logins the desktop app created.

name = "tokenworks"
protocol = "acp"
command = ["dsh", "--profile", "acp"]
# The npm CLI has been at 0.2.2 (rc series); `dsh --version` prints it.
verified = ["0.2.2"]

[models]
# What `session/new` offered on 0.2.2-rc.2, by the names the agent gives them. Any id the
# runtime lists can be used; the driver resolves it against the option the agent offers.
fallback = ["DeepSeek-V4.1-Flash", "DeepSeek-V4-Pro", "deepseek-v4-flash"]
# The `reasoning_effort` option the runtime reports.
efforts = ["off", "low", "high", "max"]

[locate]
env = "DSH_CLI"
commands = ["dsh"]
# npm's `dsh.cmd` runs the bundle through `node`; so do we, which keeps long prompts away
# from cmd.exe's quoting.
shim = "node-script"
version = ["--version"]

[locate.paths]
# `npm i -g` puts the shim here on Windows.
windows = ["%APPDATA%/npm/dsh.cmd", "%APPDATA%/npm/dsh"]
# https://docs.brew.sh/FAQ#why-should-i-install-homebrew-in-the-default-location
macos = ["/opt/homebrew/bin/dsh", "/usr/local/bin/dsh"]

[install]
label = "词元工坊 (dsh)"
# Every published version is a prerelease, so `@*`/`@latest` do not resolve; pin the series.
hint = "npm install -g @deepseek-ai/dsh@0.2.2-rc.2"
login = "sign in once in the 词元工坊 app or with `dsh web`; the CLI reuses ~/.dsh"
notes = "The runtime inside the 词元工坊 desktop app is not on PATH and cannot be launched on its own."
docs = "https://github.com/deepseek-ai/dsh"

[[install.methods]]
id = "npm"
requires = ["npm"]
# https://www.npmjs.com/package/@deepseek-ai/dsh
run = ["npm", "install", "-g", "@deepseek-ai/dsh@0.2.2-rc.2"]
upgrade = ["npm", "install", "-g", "@deepseek-ai/dsh@next"]
