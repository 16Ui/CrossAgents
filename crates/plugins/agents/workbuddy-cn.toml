# WorkBuddy 国内版 — the CodeBuddy CLI pinned to the mainland site (workbuddy.cn).
#
# Written as an extension of `codebuddy`: the models, the way the CLI is found, and how it is
# installed all come from there. What differs is the site — this entry always asks for the
# mainland origin, so an agent created from it reads the 国内站 login and never the other one.
#
# Sign in once per site. An account added with
# `crossagents account add ... --codebuddy-site china` overrides these variables for its own
# agents and carries its own profile directory, which is what keeps two logins apart; pairing
# this entry with an account of the other site is refused.

name = "workbuddy-cn"
extends = "codebuddy"
label = "WorkBuddy 国内版"
provider = "codebuddy"

[install]
label = "WorkBuddy 国内版"
login = "then sign in once with `codebuddy` and `/login`, choosing the 国内站 page (or set CODEBUDDY_API_KEY)"
notes = "Fixed to the mainland site (workbuddy.cn). The copy inside the WorkBuddy app cannot run outside it."
docs = "https://www.codebuddy.cn/docs/cli/installation"

[env]
CODEBUDDY_INTERNET_ENVIRONMENT = "internal"
CODEBUDDY_COPILOT_INTERNET_ENVIRONMENT = "internal"
