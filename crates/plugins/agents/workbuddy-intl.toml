# WorkBuddy 国际版 (workbuddyai) — the CodeBuddy CLI pinned to the international site
# (codebuddy.ai).
#
# Written as an extension of `codebuddy`: the models, the way the CLI is found, and how it is
# installed all come from there. What differs is the site — this entry always asks for the
# international origin, so an agent created from it reads the 国际站 login and never the other.
#
# Sign in once per site. An account added with
# `crossagents account add ... --codebuddy-site international` overrides these variables for
# its own agents and carries its own profile directory, which is what keeps two logins apart;
# pairing this entry with an account of the other site is refused.

name = "workbuddy-intl"
extends = "codebuddy"
label = "WorkBuddy 国际版"
provider = "codebuddy"

[install]
label = "WorkBuddy 国际版"
login = "then sign in once with `codebuddy` and `/login`, choosing the international page (or set CODEBUDDY_API_KEY)"
notes = "Fixed to the international site (codebuddy.ai). The copy inside the WorkBuddy app cannot run outside it."
docs = "https://www.codebuddy.ai/docs/cli/quickstart"

[env]
CODEBUDDY_INTERNET_ENVIRONMENT = "external"
CODEBUDDY_COPILOT_INTERNET_ENVIRONMENT = "external"
